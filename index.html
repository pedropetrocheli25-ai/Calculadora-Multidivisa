<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora Multidivisa</title>

    <!-- Configuración PWA y Móvil -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">

    <!-- Soporte para iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Remesas Pro">
    <link rel="apple-touch-icon" href="/icon-192.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Calculadora Multidivisa</h1>
            <p class="subtitle">Calcula cuánto recibirás o debes enviar entre Perú, Venezuela, Colombia y Brasil</p>
        </div>

        <div class="card">
            <div class="form-group">
                <label>País Origen</label>
                <select id="origen" class="form-control">
                    <option value="Perú">Perú</option>
                    <option value="Venezuela">Venezuela</option>
                    <option value="Colombia">Colombia</option>
                    <option value="Brasil">Brasil</option>
                </select>
            </div>

            <div class="swap-container">
                <button id="swapBtn" class="btn-swap" type="button" title="Intercambiar países">⇆</button>
            </div>

            <div class="form-group">
                <label>País Destino</label>
                <select id="destino" class="form-control">
                    <option value="Venezuela" selected>Venezuela</option>
                    <option value="Perú">Perú</option>
                    <option value="Colombia">Colombia</option>
                    <option value="Brasil">Brasil</option>
                </select>
            </div>

            <!-- Sección BCV -->
            <div id="bcvSection" class="bcv-section" style="display: none;">
                <div class="bcv-grid">
                    <div class="bcv-card usd">
                        <span class="bcv-label">🇺🇸 USD BCV</span>
                        <span class="bcv-value" id="bcvUsd">Cargando...</span>
                    </div>
                    <div class="bcv-card eur">
                        <span class="bcv-label">🇪🇺 EUR BCV</span>
                        <span class="bcv-value" id="bcvEur">Cargando...</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Moneda BCV para cálculo</label>
                    <select id="monedaBCV" class="form-control">
                        <option value="USD">💵 Dólar (USD)</option>
                        <option value="EUR">💶 Euro (EUR)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>🎯 ¿Deseas recibir un monto exacto en USD/EUR? (Opcional)</label>
                    <input type="number" id="montoBCVDeseado" class="form-control" placeholder="Ej: 10" step="any">
                </div>
            </div>

            <div class="form-group" id="montoGroup">
                <label id="lblMonto">Monto a Enviar / Convertir</label>
                <input type="number" id="monto" class="form-control" value="100" placeholder="0.00" step="any">
            </div>

            <div class="form-group">
                <label>Operación</label>
                <select id="operacion" class="form-control">
                    <option value="multiplicar">Multiplicar (Monto × Tasa)</option>
                    <option value="dividir">Dividir (Monto ÷ Tasa)</option>
                </select>
            </div>

            <div class="tasa-info-card" id="tasaInfo">
                Cargando tasa...
            </div>

            <div class="result-box">
                <span class="result-title" id="lblResultadoTitle">Resultado</span>
                <div class="result-amount" id="resultado">Bs 0,00</div>
                <div id="bcvEquivalencia" class="bcv-equivalencia" style="display: none;"></div>
            </div>

            <!-- BOTÓN WHATSAPP CÁLCULO -->
            <button class="btn-whatsapp" id="btnWhatsapp">📲 Compartir Cálculo por WhatsApp</button>

            <!-- NUEVO BOTÓN: COPIAR RECIBO DE TRANSACCIÓN -->
            <button class="btn-secondary" id="btnCopiarTransaccion" style="margin-top: 8px; width: 100%;">📋 Copiar Cálculo / Cotización</button>

            <!-- ========================================== -->
            <!-- CONTROL DE SALDOS Y REGISTRO GOOGLE SHEETS -->
            <!-- ========================================== -->
            <div style="margin-top: 25px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                <div class="form-group">
                    <label>📝 Nota / Nombre del Cliente (Opcional)</label>
                    <input type="text" id="notaControl" class="form-control" placeholder="Ej: Pago de Cliente Juan">
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="button" onclick="registrarOperacion('ENVIO')" class="btn-secondary" style="flex: 1; background-color: #1b4332; color: #74c69d; border: 1px solid #2d6a4f;">
                        ➕ Registrar Envío
                    </button>
                    <button type="button" onclick="registrarOperacion('RETORNO')" class="btn-secondary" style="flex: 1; background-color: #4a154b; color: #f72585; border: 1px solid #7209b7;">
                        ➖ Registrar Retorno
                    </button>
                </div>
            </div>

            <!-- NUEVA SECCIÓN: LISTA DESPLEGABLE DE TARIFARIOS -->
            <div class="form-group" style="margin-top: 20px;">
                <label>📋 Seleccionar Tarifario Rápido</label>
                <select id="tipoTarifario" class="form-control">
                    <option value="ninguno">-- Ver Tarifario --</option>
                    <option value="soles">📋 Tarifario en Soles (S/)</option>
                    <option value="usd">📋 Tarifario en USD ($)</option>
                </select>
            </div>

            <!-- CONTENEDOR DE TARIFARIOS GENERADOS -->
            <div id="contenedorTarifario" class="tarifario-card" style="display: none;">
                <div id="headerTarifario" class="tarifario-header"></div>
                <div class="table-container">
                    <table>
                        <thead id="theadTarifario"></thead>
                        <tbody id="tbodyTarifario"></tbody>
                    </table>
                </div>
                <button class="btn-whatsapp" id="btnWhatsappTarifario" style="margin-top: 14px;">📲 Compartir Tarifario por WhatsApp</button>

                <!-- NUEVO BOTÓN: GUARDAR COMO IMAGEN -->
                <button class="btn-secondary" id="btnImagenTarifario" style="margin-top: 8px; width: 100%;">🖼️ Descargar / Guardar como Imagen</button>
            </div>

            <button class="btn-secondary" id="verTasasBtn" style="margin-top: 12px;">Ver tabla de tasas</button>

            <div id="tablaTasas" class="modal-tasas" style="display: none;">
                <h3>Tabla de Tasas Cruzadas</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Origen</th>
                                <th>Destino</th>
                                <th>Tasa</th>
                            </tr>
                        </thead>
                        <tbody id="tablaTasasContent"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Librería para convertir HTML a Imagen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>

    <!-- Script de integración con Google Sheets -->
    <script>
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbz38RwjIQZubHiLh3aPrvBOTjUKxq8nKatNjBg2Xzdf7R0mOKChtDhOXrlbmARSgBf2/exec";

        async function registrarOperacion(tipoOperacion) {
            const montoSoles = parseFloat(document.getElementById("monto")?.value) || 0;
            const origen = document.getElementById("origen")?.value || "";
            const destino = document.getElementById("destino")?.value || "";
            const nota = document.getElementById("notaControl")?.value || "";
            
            const resultadoTexto = document.getElementById("resultado")?.innerText || "0";
            const tasaTexto = document.getElementById("tasaInfo")?.innerText || "";

            if (montoSoles <= 0) {
                alert("Por favor ingresa un monto válido.");
                return;
            }

            const payload = {
                tipo: tipoOperacion,
                montoSoles: montoSoles,
                montoBs: resultadoTexto,
                tasa: tasaTexto,
                ruta: `${origen} -> ${destino}`,
                nota: nota
            };

            try {
                const response = await fetch(URL_WEB_APP, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === "success") {
                    alert(`✅ Registro exitoso (${tipoOperacion})\nNuevo Saldo Perú: S/ ${result.nuevoSaldo.toFixed(2)}`);
                    document.getElementById("notaControl").value = "";
                } else {
                    alert("❌ Error desde Google Sheets: " + result.message);
                }
            } catch (error) {
                console.error("Error al registrar:", error);
                alert("Ocurrió un error al enviar los datos a Google Sheets.");
            }
        }
    </script>

    <!-- Registro de Service Worker PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker PWA registrado con éxito:', reg))
                    .catch(err => console.error('Error al registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
